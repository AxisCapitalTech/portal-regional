name: Diagnóstico manual de fontes oficiais
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-live-probe:
    name: Diagnóstico real de fontes oficiais (somente leitura)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, curl
          coverage: none
      - name: Consultar fontes públicas sem criar publicações
        run: php tests/probe-live-sources.php
