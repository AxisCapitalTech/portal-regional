name: Validar portal WordPress
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-and-tests:
    name: PHP ${{ matrix.php }} + verificações
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configurar PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml
          coverage: none
      - name: Validar sintaxe PHP
        shell: bash
        run: |
          set -euo pipefail
          php -v
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find wp-content tests -name '*.php' -print0)
      - name: Testar hostname seguro do AERO
        run: |
          php tests/test-aero-host.php
          php tests/test-aero-host-configured.php
      - name: Conferir arquivos de segurança
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/importar-v5.yml
          if grep -RIn --exclude-dir=.git --exclude=validar.yml -E 'alex.direito' .; then
            echo "ERRO: hostname pessoal presente no código"
            exit 1
          fi
          echo "OK hostname pessoal ausente e importador legado removido"
      - name: Validar robots e sitemap sem rede
        run: php tests/test-robots.php
      - name: Conferir data de publicação extraída do HTML
        run: php tests/test-freshness.php
      - name: Testar bloqueio da newsletter sem envio
        run: |
          php tests/test-newsletter-guard.php
          php tests/test-newsletter-guard.php --authorized
      - name: Testar canonical e compatibilidade SEO
        run: |
          php tests/test-seo-canonical.php
          php tests/test-seo-output.php
          php tests/test-footer-guard.php
          php tests/test-footer-guard.php --approved
          php tests/test-published-placeholders.php
      - name: Testar parser e URLs das cidades
        run: php tests/test-source-parser.php
      - name: Impedir publicação de pautas brutas
        run: php tests/test-publication-guard.php
      - name: Testar autorização editorial vinculada ao conteúdo
        run: php tests/test-approval.php
      - name: Testar coleta integrada sintética das cinco fontes
        run: php tests/test-official-collect.php
      - name: Impedir diagnóstico externo automático
        run: python3 tests/test-ci-policy.py
      - name: Validar estrutura e cidades prioritárias
        run: python3 tests/test-repository.py
      - name: Gerar pacotes WordPress
        if: matrix.php == '8.2'
        shell: bash
        run: |
          mkdir -p dist
          (cd wp-content/plugins && zip -qr ../../dist/portal-regional-agentes.zip portal-regional-agentes)
          (cd wp-content/themes && zip -qr ../../dist/portal-regional-tema.zip portal-regional-tema)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.php == '8.2'
        with:
          name: portal-regional-wordpress
          path: dist/*.zip
          if-no-files-found: error

  wordpress-smoke:
    name: WordPress real + MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: portalregional
          MARIADB_USER: portal
          MARIADB_PASSWORD: testpassword
          MARIADB_ROOT_PASSWORD: testrootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, mysqli, pdo_mysql, curl
          coverage: none
      - name: Instalar WordPress de teste via WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/e1b93919b8da39cbc3707f44bd2c61df3bd5b0d6/phar/wp-cli.phar -o /tmp/wp-cli.phar
          echo "be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832  /tmp/wp-cli.phar" | sha512sum --check --strict
          mkdir -p /tmp/portal-wp
          php /tmp/wp-cli.phar core download --path=/tmp/portal-wp --allow-root
          php /tmp/wp-cli.phar config create --path=/tmp/portal-wp --dbname=portalregional --dbuser=portal --dbpass=testpassword --dbhost=127.0.0.1:3306 --allow-root
          wp_test_password="$(openssl rand -hex 24)"
          php /tmp/wp-cli.phar core install --path=/tmp/portal-wp --url=http://localhost:8088 --title='Portal Regional Homologação' --admin_user=testadmin --admin_password="$wp_test_password" --admin_email=test@example.invalid --skip-email --allow-root
          cp -a wp-content/plugins/portal-regional-agentes /tmp/portal-wp/wp-content/plugins/
          cp -a wp-content/themes/portal-regional-tema /tmp/portal-wp/wp-content/themes/
          php /tmp/wp-cli.phar plugin activate portal-regional-agentes --path=/tmp/portal-wp --allow-root
          php /tmp/wp-cli.phar theme activate portal-regional-tema --path=/tmp/portal-wp --allow-root
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/smoke-wordpress.php" --path=/tmp/portal-wp --allow-root
          php tests/test-fingerprint-concurrency.php /tmp/portal-wp/wp-load.php
          php tests/test-collector-concurrency.php /tmp/portal-wp/wp-load.php
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/test-published-placeholders.php" --path=/tmp/portal-wp --allow-root

  staging-docker:
    name: Docker Railway / acesso restrito
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Conferir configuração de homologação
        run: python3 tests/test-staging-railway.py
      - name: Compilar imagem WordPress de homologação
        run: docker build -f deploy/railway/Dockerfile -t pr1-staging:test .
      - name: Bloquear inicialização sem credenciais
        shell: bash
        run: |
          if docker run --rm pr1-staging:test apache2-foreground > /tmp/pr1-error.log 2>&1; then
            echo 'ERRO: não exigiu STAGING_USER'; exit 1
          fi
          grep -q 'STAGING_USER' /tmp/pr1-error.log
      - name: Verificar autenticação HTTP e senha
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f pr1-auth-test >/dev/null 2>&1 || true' EXIT
          staging_test_password="$(openssl rand -hex 24)"
          docker run -d --name pr1-auth-test -p 127.0.0.1:18080:80 \
            -e STAGING_USER=editor -e STAGING_PASSWORD="$staging_test_password" \
            -e WORDPRESS_DB_HOST=127.0.0.1:3306 \
            -e WORDPRESS_DB_NAME=testdb -e WORDPRESS_DB_USER=test \
            -e WORDPRESS_DB_PASSWORD=test pr1-staging:test
          status=000
          for i in $(seq 1 30); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/ || true)
            if [ "$status" = 401 ]; then break; fi
            sleep 2
          done
          [ "$status" = 401 ] || { echo "ERRO: resposta sem senha $status"; docker logs pr1-auth-test; exit 1; }
          status_wrong=$(curl --silent --output /dev/null --write-out '%{http_code}' -u visitante:errado http://127.0.0.1:18080/ || true)
          [ "$status_wrong" = 401 ] || { echo "ERRO: senha errada retornou $status_wrong"; exit 1; }
          status_good=$(curl --silent --output /dev/null --write-out '%{http_code}' -u "editor:$staging_test_password" http://127.0.0.1:18080/ || true)
          [ "$status_good" != 401 ] && [ "$status_good" != 000 ] || { echo "ERRO: senha válida rejeitada $status_good"; exit 1; }
