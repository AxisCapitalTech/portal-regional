name: Importar código Portal Regional V5
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/importar-v5.yml'
permissions:
  contents: write
jobs:
  importar-e-validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml
          coverage: none
      - name: Verificar integridade e extrair fonte
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/parte-{01..07}.b64 | base64 --decode > "$RUNNER_TEMP/portal-v5.tar.xz"
          echo "1eb1e85c550d0cb7bce13195e2488bc7b3265beae983b9839db2e10f75e9c0b9  $RUNNER_TEMP/portal-v5.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/portal-src"
          tar -xJf "$RUNNER_TEMP/portal-v5.tar.xz" -C "$RUNNER_TEMP/portal-src" --no-same-owner
          test -f "$RUNNER_TEMP/portal-src/wp-content/plugins/portal-regional-agentes/portal-regional-agentes.php"
          test -f "$RUNNER_TEMP/portal-src/wp-content/themes/portal-regional-tema/style.css"
          test -f "$RUNNER_TEMP/portal-src/tests/test-approval.php"
          cp -a "$RUNNER_TEMP/portal-src/." .
          git rm -r --ignore-unmatch bootstrap
          git add -A
      - name: Sintaxe PHP e testes unitários
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find wp-content tests -name '*.php' -print0)
          php tests/test-source-parser.php
          php tests/test-publication-guard.php
          php tests/test-approval.php
          php tests/test-official-collect.php
          python3 tests/test-repository.py
      - name: Versionar código completo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat: importar Portal Regional V5 validado'
            git push origin HEAD:main
          fi
